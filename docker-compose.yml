---
name: devops-in-a-container
version: "3"
services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.3-ce.0
    container_name: dep-pipeline-gitlab
    restart: always
    hostname: dep-pipeline-gitlab
    ports:
      - 80:80
      - 22:22
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        gitlab_rails['lfs_enabled'] = true
        gitlab_rails['initial_root_password'] = 'P@ssw0rd1234'
        gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
        node_exporter['enable'] = true
        node_exporter['listen_address'] = '0.0.0.0:9100'
        redis_exporter['listen_address'] = '0.0.0.0:9121'
        postgres_exporter['listen_address'] = '0.0.0.0:9187'
        gitlab_exporter['listen_address'] = '0.0.0.0'
        gitlab_exporter['listen_port'] = '9168'
        gitaly['configuration'] = { prometheus_listen_addr: '0.0.0.0:9236' }
        gitlab_workhorse['prometheus_listen_addr'] = '0.0.0.0:9229'
        sidekiq['listen_address'] = '0.0.0.0'
        sidekiq['listen_port'] = 8082
        nginx['status'] = { "enable" => true, "listen_addresses" => ["0.0.0.0"], "port" => 8060, "vts_enable" => true }
        # Add any other gitlab.rb configuration here, each on its own line
    shm_size: '256m'
    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      - gitlab_artifacts:/var/opt/gitlab/gitlab-rails/shared/artifacts  # Volume for artifacts
    networks:
      - dep-pipeline-network
  gitlab-runner:
    image: gitlab/gitlab-runner:alpine
    depends_on:
      - gitlab
    container_name: dep-pipeline-gitlab-runner
    restart: always
    volumes:
      - ./gitlab-runner/config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dep-pipeline-network
  prometheus:
    image: prom/prometheus:latest
    container_name: dep-pipeline-prometheus
    restart: always
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - dep-pipeline-network
  grafana:
    image: grafana/grafana:latest
    container_name: dep-pipeline-grafana
    restart: always
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=P@ssw0rd1234
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - dep-pipeline-network
  .nexus:
    image: sonatype/nexus3:3.89.0
    container_name: dep-pipeline-nexus
    restart: always
    environment:
      - NEXUS_SECURITY_RANDOMPASSWORD=false
    ports:
      - 8082:8081
    volumes:
      - ./nexus-data:/nexus-data
    networks:
      - dep-pipeline-network
  .nginx:
    image: nginx:latest
    container_name: dep-pipeline-nginx
    restart: always
    ports:
      - 443:443
      - 8081:80
      - 5001:5001
      - 5000:5000
    volumes:
      - ./nginx/certs:/etc/nginx/external/
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - dep-pipeline-network
networks:
  dep-pipeline-network:
    driver: bridge
volumes:
  gitlab_data:
  gitlab_artifacts:
  prometheus_data:
  grafana_data: