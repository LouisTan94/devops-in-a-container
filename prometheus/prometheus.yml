global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gitlab_exporter
    static_configs:
      - targets: ['dep-pipeline-gitlab:9168']

  - job_name: redis
    static_configs:
      - targets:
        - dep-pipeline-gitlab:9121

  - job_name: postgres
    static_configs:
      - targets:
        - dep-pipeline-gitlab:9187

  - job_name: node
    static_configs:
      - targets:
        - dep-pipeline-gitlab:9100

  - job_name: gitlab-workhorse
    static_configs:
      - targets:
        - dep-pipeline-gitlab:9229

  - job_name: gitlab-rails
    metrics_path: "/-/metrics"
    scheme: http
    static_configs:
      - targets:
        - dep-pipeline-gitlab

  - job_name: gitlab-sidekiq
    static_configs:
      - targets:
        - dep-pipeline-gitlab:8082

  - job_name: gitlab_exporter_database
    metrics_path: "/database"
    static_configs:
      - targets:
        - dep-pipeline-gitlab:9168

  - job_name: gitlab_exporter_sidekiq
    metrics_path: "/sidekiq"
    static_configs:
      - targets:
        - dep-pipeline-gitlab:9168

  - job_name: gitaly
    static_configs:
      - targets:
        - dep-pipeline-gitlab:9236
