groups:
  - name: instance
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target down: {{ $labels.job }} ({{ $labels.instance }})"
          description: "Prometheus target has been unreachable for more than 1 minute."

  - name: node
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 90% for more than 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Disk usage is above 85% (current: {{ $value | printf \"%.1f\" }}%)."

  - name: gitlab
    rules:
      - alert: GitlabSidekiqQueueHigh
        expr: sidekiq_queue_size > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GitLab Sidekiq queue is too large"
          description: "Sidekiq queue '{{ $labels.name }}' has {{ $value }} jobs queued for more than 5 minutes."

      - alert: GitlabSidekiqJobLatencyHigh
        expr: sidekiq_queue_latency_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GitLab Sidekiq job latency is high"
          description: "Sidekiq queue '{{ $labels.name }}' latency is {{ $value | printf \"%.0f\" }}s (threshold: 300s)."

      - alert: GitlabPumaQueueHigh
        expr: puma_queued_connections > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GitLab Puma has too many queued connections"
          description: "Puma has {{ $value }} queued connections, indicating the app is overloaded."

      - alert: GitlabGitalyErrorRateHigh
        expr: rate(grpc_server_handled_total{grpc_code!~"OK|NotFound|Unauthenticated|AlreadyExists|FailedPrecondition|Canceled"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GitLab Gitaly error rate is high"
          description: "Gitaly is returning errors at {{ $value | printf \"%.2f\" }} req/s."

  - name: postgres
    rules:
      - alert: PostgresqlHighConnections
        expr: pg_stat_activity_count > 200
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL has too many connections"
          description: "PostgreSQL has {{ $value }} active connections (threshold: 200)."

      - alert: PostgresqlDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter cannot connect to the database."

  - name: redis
    rules:
      - alert: RedisHighMemory
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | printf \"%.1f\" }}% of its max memory."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter cannot connect to the Redis instance."
